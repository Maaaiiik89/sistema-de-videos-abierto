<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{W}}, height={{H}}" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script>window.__FORMATO = "{{FORMATO}}";</script>
    <script src="assets/escena/voz.js"></script>
    <script src="assets/escena/subtitulos.js"></script>
    <link rel="stylesheet" href="assets/estilo/estilo.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: {{W}}px; height: {{H}}px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; }
      #clip { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    </style>
  </head>
  <body>
    <!-- Video grabado con subtítulos dinámicos. Armado por herramientas/subtitular.mjs -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="{{W}}" data-height="{{H}}">
      <video id="clip" class="clip" src="assets/media/video.mp4" data-start="0" data-duration="{{DUR}}" data-track-index="0" data-has-audio="true" playsinline></video>
      <div id="subtitulos" data-composition-id="subtitulos" data-composition-src="compositions/subtitulos.html"
        data-start="0" data-duration="{{DUR}}" data-track-index="1" data-track-kind="captions" data-width="{{W}}" data-height="{{H}}"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
